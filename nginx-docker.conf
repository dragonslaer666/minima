# Автодеплой при каждом push. Положите файл в .github/workflows/deploy.yml репозитория.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_KEY  — приватный ключ (содержимое ~/.ssh/id_ed25519)
#   HOST     — IP или домен сервера
#   USER     — пользователь (обычно root или deploy)
#   TARGET   — папка сайта на сервере, например /var/www/potok
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка, что файл на месте
        run: test -f index.html && echo "index.html найден ($(du -h index.html | cut -f1))"

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Заливаем на сервер
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.USER }}@${{ secrets.HOST }}" "mkdir -p ${{ secrets.TARGET }}"
          rsync -avz --chmod=F644,D755 -e "ssh -i ~/.ssh/id_ed25519" index.html \
            "${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.TARGET }}/index.html"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.USER }}@${{ secrets.HOST }}" "nginx -t && systemctl reload nginx || true"

# --- Альтернатива без своего сервера: публикация на GitHub Pages ---
# 1) Settings → Pages → Source: Deploy from a branch → main / (root)
# 2) Сайт будет доступен как https://<логин>.github.io/<репозиторий>/
#    Полностью статический файл, сборка не нужна.
