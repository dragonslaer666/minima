# Обратный прокси перед FastAPI. Кладётся в /etc/nginx/conf.d/default.conf.
upstream minima_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Выпуск сертификата через certbot (webroot): смонтируйте ./deploy/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        proxy_pass http://minima_web;
        access_log off;
    }

    location / {
        proxy_pass http://minima_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Важно: Origin и Host должны дойти без изменений — backend сверяет их
        # для защиты от межсайтовых запросов.
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

