#!/usr/bin/env bash
# Развёртывание одной командой: ./deploy.sh
# Требуется: ssh-доступ по ключу (ssh-copy-id) и rsync на сервере.
set -euo pipefail

SERVER="${SERVER:-root@203.0.113.10}"      # user@IP или user@домен
TARGET="${TARGET:-/var/www/potok}"          # папка на сервере
FILE="${FILE:-../index.html}"               # что заливаем

echo "→ Создаём папку $TARGET и заливаем $FILE"
ssh "$SERVER" "mkdir -p $TARGET"
rsync -avz --chmod=F644,D755 "$FILE" "$SERVER:$TARGET/index.html"

echo "→ Проверяем конфиг nginx и перезагружаем"
ssh "$SERVER" "nginx -t && systemctl reload nginx || true"

echo "→ Готово. Проверьте: https://ваш-домен/"
