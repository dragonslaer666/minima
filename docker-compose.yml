# Прод-запуск: nginx на 80 порту + backend uvicorn внутри docker-сети.
# Данные (SQLite) живут в именованном томе minima-data.
services:
  web:
    build: .
    image: minima-console:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/minima-support.sqlite3
    volumes:
      - minima-data:/app/data
    # Флаги --proxy-headers --forwarded-allow-ips '*' нужны, чтобы в логах и
    # ограничениях частоты был реальный IP клиента, а не адрес nginx.
    # Доверять X-Forwarded-For можно только потому, что порт web наружу не открыт.
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - 8000
      - --proxy-headers
      - --forwarded-allow-ips
      - '*'
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Для отладки без nginx раскомментируйте, но не оставляйте порт открытым в продакшене:
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Раскомментируйте для certbot (webroot) и для сертификатов:
      # - ./deploy/certbot:/var/www/certbot:ro
      # - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  minima-data:
    name: minima-data
