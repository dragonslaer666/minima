  if (t.status === 'PROCESSING') items.push({ label:'Отметить выполненной', icon:'check', act:'card-status', data:uuid+'|COMPLETED' });
  if (t.assigneeId && t.status === 'PROCESSING') items.push({ label:'Вернуть в общий пул', icon:'refresh', act:'card-status', data:uuid+'|PENDING' });
  if (!t.assigneeId) items.push({ label:'Назначить на себя', icon:'user', act:'card-assign-me', data:uuid });
  items.push({ sep:true });
  items.push({ label:'Приоритет: срочно', icon:'flame', act:'card-prio', data:uuid+'|URGENT' });
  items.push({ label:'Приоритет: обычный', icon:'target', act:'card-prio', data:uuid+'|NORMAL' });
  items.push({ sep:true });
  items.push({ label:'Скопировать ссылку', icon:'copy', act:'card-copy', data:uuid });
  items.push({ label:'Открыть клиента', icon:'chat', act:'card-client', data:uuid });
  box.innerHTML = items.map(it => it.sep ? '<hr>' : '<button role="menuitem" data-act="'+it.act+'" data-uuid="'+it.data.split('|')[0]+'" data-target="'+it.data+'">'+ic(it.icon)+esc(it.label)+'</button>').join('');
  box.style.cssText = 'position:fixed;z-index:400;top:'+Math.min(window.innerHeight-320, r.bottom+6)+'px;left:'+Math.min(window.innerWidth-230, Math.max(10, r.right-200))+'px';
  document.body.appendChild(box);
  state.cardMenuOpen = uuid;
  setTimeout(() => { document.addEventListener('click', closeCardMenuOnce, true); }, 0);
}
function closeCardMenu(){ const el = $('#card-menu'); if (el) el.remove(); state.cardMenuOpen = null; }
function closeCardMenuOnce(e){ if (e.target.closest && e.target.closest('#card-menu')) return; document.removeEventListener('click', closeCardMenuOnce, true); closeCardMenu(); }
ACTIONS['card-open'] = el => { closeCardMenu(); openTask(el.dataset.uuid); };
ACTIONS['card-client'] = el => {
  closeCardMenu();
  const t = db.tasks.find(x => x.uuid === el.dataset.uuid);
  const c = db.clients.find(x => x.id === t.clientId);
  openClient(c.uuid);
};

/* ---------- DnD ---------- */
let dragData = null, dragEl = null;
function bindDnD(){
  document.addEventListener('dragstart', e => {
    const card = e.target.closest && e.target.closest('.tcard');
    if (!card) return;
    dragData = { uuid: card.dataset.task, status: card.dataset.status };
    dragEl = card;
    card.classList.add('tcard--dragging');
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', card.dataset.task); } catch(err){}
    state.drag.id = card.dataset.task;
    $$('.col__body').forEach(c => { if (!c.querySelector('.col__drop')) { const d = document.createElement('div'); d.className = 'col__drop'; const st = c.dataset.drop; d.textContent = 'Отпустите карточку, чтобы перевести в «' + STATUS[st].title.toLowerCase() + '»'; c.appendChild(d); } });
  });
  document.addEventListener('dragend', () => {
    if (dragEl) dragEl.classList.remove('tcard--dragging');
    state.drag.id = null; $$('.col--over').forEach(c => c.classList.remove('col--over'));
    $$('.col__body').forEach(c => { const d = c.querySelector('.col__drop'); if (d) d.remove(); });
    render();
  });
  document.addEventListener('dragover', e => {
    const col = e.target.closest && e.target.closest('[data-drop]');
    if (!col || !state.drag.id) return;
    e.preventDefault();
    if (state.drag.over !== col.dataset.drop){
      state.drag.over = col.dataset.drop;
      $$('.col--over').forEach(c => c.classList.remove('col--over'));
      col.closest('.col').classList.add('col--over');
    }
  });
  document.addEventListener('drop', e => {
    const col = e.target.closest && e.target.closest('[data-drop]');
    if (!col || !dragData) return;
    e.preventDefault();
    const target = col.dataset.drop;
    const uuid = dragData.uuid, from = dragData.status;
    dragData = null;
    if (from === target) return;
    if (target === 'CANCELLED' && !canDo('tasks.cancel')){
      toast('err','Недостаточно прав','Переводить задачи в «Отменено» может администратор или владелец.');
      return;
    }
    optimisticMove(uuid, target, from);
  });
}
function optimisticMove(uuid, target, from){
  const t = db.tasks.find(x => x.uuid === uuid);
  const backup = { status:t.status, assigneeId:t.assigneeId, assignedAt:t.assignedAt, completedAt:t.completedAt };
  t.status = target;
  if (target === 'PROCESSING' && !t.assigneeId){ t.assigneeId = me().id; t.assignedAt = NOW(); }
  if (target === 'COMPLETED') t.completedAt = NOW();
  if (target === 'PENDING'){ t.assigneeId = null; t.assignedAt = null; t.completedAt = null; }
  t.updatedAt = NOW();
  if (state.data.tasks){ const ix = state.data.tasks.findIndex(x => x.taskId === uuid); if (ix > -1) state.data.tasks[ix] = taskDTO(t); }
  render();
  const perm = target === 'CANCELLED' ? 'tasks.cancel' : 'tasks.write';
  Api.patch('/api/v1/tasks/' + uuid, { status:target, version:t.version }).then(r => {
    t.version++;
    toast('ok', 'Статус обновлён', '«' + t.title.slice(0,50) + '» → ' + STATUS[target].short + ' (optimistic update подтверждён сервером)');
    pushFeed('task','Смена статуса', shortName(meUser()) + ': ' + STATUS[from].short + ' → ' + STATUS[target].short, 'PATCH /tasks/{uuid}');
    if (target === 'COMPLETED'){
      const c = db.clients.find(x => x.id === t.clientId);
      botReplyToClient(t.clientId, db.organization.ackTemplate, true);
    }
    refreshTasks(true);
    if (state.taskDetail && state.taskDetail.task.taskId === uuid) openTask(uuid);
  }).catch(e => {
    if (e.status === 0){
      pendingOffline.push({ method:'PATCH', path:'/api/v1/tasks/' + uuid, body:{ status:target, version:t.version } });
      toast('warn','Сохранено офлайн','Изменение статуса ушло в очередь и синхронизируется, когда сеть вернётся. Доска обновлена локально.', [], 6500);
      render();
      return;
    }
    Object.assign(t, backup);
    if (state.data.tasks){ const ix = state.data.tasks.findIndex(x => x.taskId === uuid); if (ix > -1) state.data.tasks[ix] = taskDTO(t); }
    render();
    if (e.status === 409){
      toast('warn', eTitle(e), eDetail(e), [{ label:'Обновить данные', fn:() => refreshTasks() }], 9000);
      pushFeed('error','409 Конфликт версий', eDetail(e), 'If-Match / optimistic lock');
    } else toast('err', eTitle(e), eDetail(e));
  });
}

/* ---------- формы ---------- */
function bindForms(){
  document.addEventListener('submit', async e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const name = f.dataset.form;
    const fd = new FormData(f);
    try {
      if (name === 'login'){
        const email = fd.get('email'), pass = fd.get('password');
        const u = db.users.find(x => x.email.toLowerCase() === String(email).toLowerCase().trim());
        await doLogin(email, pass, u ? db.memberships.find(m => m.userId === u.id).role : null);
      }
      else if (name === 'register'){
        const skip = e.submitter && e.submitter.dataset.skip;
        const reg = state.reg;
        ['title','inn','firstName','lastName','email','password','employeeEmail','employeeName'].forEach(k => { if (fd.get(k) !== null) reg[k] = fd.get(k); });
        if (skip && reg.step === 3){ reg.step = 3; }
        const r = await Api.post('/api/v1/organizations', { title:reg.title, ownerEmail:reg.email || 'owner@vector.ru', ownerPassword:reg.password || 'demo1234', ownerName:reg.firstName, ownerSurname:reg.lastName });
        if (reg.step < 3){ reg.step++; render(); return; }
        if (reg.employeeEmail){
          const inv = await Api.post('/api/v1/employees/invitations', { email:reg.employeeEmail, role:'EMPLOYEE' });
          toast('ok','Организация создана','Владельцу: ' + reg.email + ' · приглашение отправлено на ' + inv.body.email + ' (ссылка действует до ' + fmtDateTime(+new Date(inv.body.expiresAt)) + ')', [{ label:'Скопировать ссылку', fn: () => copy(inv.body.inviteLink) }], 9000);
        } else {
          toast('ok','Организация создана','Роль владельца выдана: ' + (reg.email||'owner@vector.ru') + '. Можно приглашать команду.');
        }
        state.authMode = 'login'; state.reg = null;
        await doLogin('ivanov@vector.ru','demo1234');
      }
      else if (name === 'new-task'){
        const body = { title:fd.get('title'), description:fd.get('description'), clientId:+fd.get('clientId'), categoryId:+fd.get('categoryId'), priority:fd.get('priority'), version:0 };
        const r = await Api.post('/api/v1/tasks', body);
        state.modal = null; state.filters.status = 'ALL'; render();
        toast('ok','Задача создана','Открыли карточку: ' + r.body.task.title.slice(0,50));
        pushFeed('task','Задача создана вручную', shortName(meUser()) + ': ' + r.body.task.title, 'POST /api/v1/tasks');
        await refreshTasks(true); openTask(r.body.task.taskId);
      }
      else if (name === 'invite'){
        const r = await Api.post('/api/v1/employees/invitations', { email:fd.get('email'), role:fd.get('role') });
        state.modal = null; render();
        toast('ok','Приглашение отправлено', 'Ссылка действует до ' + fmtDateTime(+new Date(r.body.expiresAt)) + '. Пароль сотрудник задаёт сам.', [{ label:'Скопировать ссылку', fn:() => copy(r.body.inviteLink) }], 9000);
        loadView('employees');
      }
      else if (name === 'comment'){
        const uuid = f.dataset.uuid;
        await Api.post('/api/v1/tasks/' + uuid + '/comments', { text: fd.get('text') });
        await openTask(uuid);
      }
      else if (name === 'reply'){
        const uuid = f.dataset.uuid;
        state.replyDraft = fd.get('text');
        const r = await Api.post('/api/v1/tasks/' + uuid + '/reply', { text: fd.get('text') });
        state.replyDraft = '';
        const t = db.tasks.find(x => x.uuid === uuid);
        botReplyToClient(t.clientId, fd.get('text'), false);
        await openTask(uuid);
        toast('ok','Доставлено в Telegram', 'Сообщение ушло клиенту, отметка времени сохранена в переписке.');
      }
      else if (name === 'reply-client'){
        const c = db.clients.find(x => x.uuid === f.dataset.uuid);
        const r = await Api.post('/api/v1/tasks/' + (db.tasks.find(t => t.clientId === c.id) || {uuid:''}).uuid + '/reply', { text: fd.get('text') }).catch(() => null);
        state.modal = null; render();
        db.messages.push({ id:db.seq.mid++, uuid:uid(), organizationId:1, clientId:c.id, taskId:null, direction:'OUTBOUND', text:fd.get('text'), createdAt:NOW(), read:true });
        botReplyToClient(c.id, fd.get('text'), false);
        toast('ok','Ответ отправлен','Сообщение доставлено клиенту в Telegram.');
      }
      else if (name === 'cancel'){
        const uuid = f.dataset.uuid;
        state.modal = null; render();
        const reason = fd.get('reason');
        applyLocal(uuid, { status:'CANCELLED' });
        await patchTask(uuid, { status:'CANCELLED', reason:reason }, 'Задача отменена');
        toast('info','Причина записана в историю','«' + reason + '» — клиенту автоответ не отправляется.');
      }
      else if (name === 'org'){
        await Api.patch('/api/v1/organizations/' + db.organization.uuid, { title:fd.get('title'), slug:fd.get('slug') });
        db.organization.title = fd.get('title');
        toast('ok','Настройки сохранены','Название и slug обновлены. Событие записано в аудит.');
        render();
      }
      else if (name === 'category'){
        await Api.post('/api/v1/categories', { title: fd.get('title') });
        toast('ok','Категория добавлена','AI будет выбирать её наряду с остальными.');
        loadView('settings');
      }
      else if (name === 'bot'){
        f.reset();
        await botSend(fd.get('text'));
      }
    } catch(e){
      const b = e.body || {};
      if (name === 'login'){ state.authMode = 'login'; }
      toast('err', b.title || 'Ошибка', b.detail || e.message);
      if (b.status === 409) pushFeed('error', b.title, b.detail, 'HTTP 409');
      render();
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'palette-input'){ state.paletteQuery = t.value; state.paletteSel = 0; const q = t.value.toLowerCase(); const list = paletteCommands().filter(c => c.label.toLowerCase().indexOf(q) > -1); renderModalLayer(); const i = $('#palette-input'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
    if (t.dataset.bind === 'board.search' || t.dataset.bind === 'table.search'){
      state.filters.q = t.value; state.lastFocus = t.dataset.bind;
      clearTimeout(state._searchT);
      state._searchT = setTimeout(() => { state.page = 0; refreshTasks(true); }, 260);
    }
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.dataset.filter){
      const key = t.dataset.filter;
      if (key === 'sort') state.sort = t.value;
      else state.filters[key] = t.value;
      e.stopPropagation();
      state.page = 0;
      if (state.view === 'board' || state.view === 'tasks') await refreshTasks(); else render();
      return;
    }
    if (t.dataset.scenario !== undefined){ setScenario(t.dataset.scenario, t.checked); return; }
    if (t.dataset.act === 'change-category'){
      const uuid = t.dataset.uuid; const cat = db.categories.find(c => c.id === +t.value);
      await patchTask(uuid, { categoryId: +t.value }, 'Категория: ' + cat.title);
      toast('info','Спасибо за правку','Это ушло в метрику точности AI: доля задач, исправленных за моделью.');
      return;
    }
    if (t.dataset.act === 'change-priority'){
      const uuid = t.dataset.uuid;
      await patchTask(uuid, { priority: t.value }, 'Приоритет: ' + PRIORITY[t.value].t);
      return;
    }
  });
  document.addEventListener('click', e => {
    const pal = e.target.closest('[data-palette]');
    if (pal){ const i = +pal.dataset.palette; const q = (state.paletteQuery||'').toLowerCase(); const list = paletteCommands().filter(c => !q || c.label.toLowerCase().indexOf(q) > -1); const cmd = list[i]; state.paletteOpen = false; render(); if (cmd) cmd.run(); return; }
    const log = e.target.closest('[data-log]');
    if (log){
      const body = document.querySelector('[data-logbody="'+log.dataset.log+'"]');
      if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
      return;
    }
    const card = e.target.closest('.tcard');
    if (card && !e.target.closest('[data-act]')){
      if (e.target.closest('.card-menu')) return;
      openTask(card.dataset.task); return;
    }
    const openT = e.target.closest('[data-open-task]');
    if (openT){ openTask(openT.dataset.openTask); return; }
    const openC = e.target.closest('[data-open-client]');
    if (openC){ openClient(openC.dataset.openClient); return; }
    const demoLogin = e.target.closest('[data-demo-login]');
    if (demoLogin){ const d = DEMO_LOGINS[+demoLogin.dataset.demoLogin]; doLogin(d.email, 'demo1234'); return; }
    const act = e.target.closest('[data-act]');
    if (act){
      const fn = ACTIONS[act.dataset.act];
      if (fn){ fn(act, e); }
      return;
    }
    const nav = e.target.closest('[data-nav]');
    if (nav){ setView(nav.dataset.nav); return; }
  });
  document.addEventListener('keydown', e => {
    const typing = /input|textarea|select/i.test((document.activeElement||{}).tagName || '') || (document.activeElement||{}).isContentEditable;
    if (e.key === 'Escape'){
      if (state.paletteOpen){ state.paletteOpen = false; render(); return; }
      if (state.modal || state.drawer || state.notifOpen || state.headerMenu){ state.modal = null; state.drawer = null; state.notifOpen = false; state.headerMenu = null; closeCardMenu(); render(); return; }
      if (state.navOpen){ state.navOpen = false; render(); }
      return;
    }
    if (state.paletteOpen){
      const q = (state.paletteQuery||'').toLowerCase();
      const list = paletteCommands().filter(c => !q || c.label.toLowerCase().indexOf(q) > -1);
      if (e.key === 'ArrowDown'){ e.preventDefault(); state.paletteSel = Math.min(list.length-1, (state.paletteSel||0)+1); renderModalLayer(); const el = $$('[data-palette]')[state.paletteSel]; if (el) el.setAttribute('aria-selected','true'); }
      if (e.key === 'ArrowUp'){ e.preventDefault(); state.paletteSel = Math.max(0, (state.paletteSel||0)-1); renderModalLayer(); }
      if (e.key === 'Enter'){ const cmd = list[state.paletteSel||0]; state.paletteOpen = false; render(); if (cmd) cmd.run(); }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); ACTIONS['palette'](); return; }
    if (typing) return;
    if (e.key === '/'){ e.preventDefault(); ACTIONS['palette'](); }
    if (e.key === 'n' || e.key === 'т'){ ACTIONS['new-task'](); }
    if (e.key === 'b' || e.key === 'и'){ setView('board'); }
    if (e.key === 't' || e.key === 'е'){ setView('tasks'); }
    if (e.key === 'r' || e.key === 'к'){ ACTIONS['refresh'](); }
    if (e.key === '?'){ ACTIONS['shortcuts'](); }
  });
}

/* ---------- автопилот ---------- */
const AUTOPILOT_TEXTS = [
  'Здравствуйте! Нужен счёт на предоплату по договору №512, оплатим сегодня',
  'Добрый день! Интересует монтаж линии розлива — какие сроки и стоимость?',
  'Третий раз пишу: датчик давления не работает, сколько можно?',
  'Подскажите, возможна ли доставка в Каспийск на следующей неделе?',
  'Нужно КП на 12 единиц тары, сроки поставки важны',
  'Добрый день, по гарантии потек уплотнитель, что делать?',
  'Здравствуйте, можно ли подключить оборудование к сети 380 В?'
];
let autopilotTimer = null;
function startAutopilot(){
  if (autopilotTimer){ clearInterval(autopilotTimer); autopilotTimer = null; }
  if (!scenario.autopilot) return;
  const tick = async () => {
    if (!scenario.autopilot || state.botTyping) return;
    state.botClientIdx = Math.floor(Math.random()*db.clients.length);
    const txt = AUTOPILOT_TEXTS[Math.floor(Math.random()*AUTOPILOT_TEXTS.length)];
    await botSend(txt, { clientIdx: state.botClientIdx });
    if (Math.random() > 0.5){
      await sleep(600);
      const t = db.tasks.find(x => x.status === 'PENDING');
      if (t){
        const mgr = db.memberships.find(m => m.status === 'ACTIVE' && m.role === 'EMPLOYEE' && m.id !== me().id) || me();
        t.assigneeId = mgr.id; t.status = 'PROCESSING'; t.assignedAt = NOW(); t.version++; t.updatedAt = NOW();
        pushEvent(t.id, mgr.userId, 'CLAIMED', 'PENDING', 'PROCESSING', {});
        pushFeed('task','Менеджер забрал задачу', shortName(userByMembership(mgr)) + ': ' + t.title.slice(0,50), 'mock');
        bus.emit('task.updated', { task:taskDTO(t), flash:true });
        if (state.view === 'board' || state.view === 'tasks') refreshTasks(true);
      }
    }
  };
  autopilotTimer = setInterval(tick, 9000);
  setTimeout(tick, 1200);
}

/* ---------- запуск ---------- */
let dashFlash = null;
function boot(){
  document.documentElement.setAttribute('data-theme', state.theme);
  bindDnD();
  bindForms();
  bus.on('task.created', payload => {
    if (state.view === 'board' || state.view === 'tasks' || state.view === 'employees' || state.view === 'analytics') refreshTasks(true);
    setTimeout(() => { dashFlash = null; }, 1700);
  });
  bus.on('task.updated', () => { if (state.view === 'board' || state.view === 'tasks') refreshTasks(true); });
  // стартовая переписка в демо-боте
  const c = db.clients[0];
  state.botChat.push({ dir:'out', text:'Здравствуйте! Это бот компании «Вектор». Напишите, что нужно — задача сразу попадёт менеджеру.', ts:NOW()-30*MIN, auto:true, buttons:['Прайс-лист','Связаться с менеджером','Статус заявки'] });
  state.botChat.push({ dir:'in', text:'Здравствуйте! Хочу заказать расчёт стоимости доставки оборудования.', ts:NOW()-38*MIN });
  state.botChat.push({ dir:'out', text:'Спасибо! Обращение принято, менеджер ответит в рабочее время (пн–пт, 09:00–19:00).', ts:NOW()-38*MIN+SEC, auto:true });
  render();
  window.__POTOK = { db:db, state:state, scenario:scenario, Api:Api, bus:bus, actions:ACTIONS, theme:() => toggleTheme() };
  setTimeout(() => toast('info','Демо-режим','Данные и роли вымышленные. Зайдите на «Демо-стенд», чтобы увидеть сквозной сценарий и аварийные режимы.', [{ label:'Открыть стенд', fn:() => setView('demo') }], 9000), 700);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
